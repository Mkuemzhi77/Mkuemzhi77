# Stage 0 CI — docs check only.
# Backend jobs will be added when backend code exists.

stages:
  - lint

lint:docs:
  stage: lint
  image: alpine:3.20
  script:
    - echo "Stage 0 checking docs"
    - test -f README.md
    - test -f ROADMAP.md
    - test -f CONTRIBUTING.md
    - test -f docs/architecture.md
    - test -f docs/domain.md
    - test -f docs/api.md
    - test -f docs/setup.md
    - echo OK

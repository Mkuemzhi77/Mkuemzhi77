stages:
  - lint
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POSTGRES_DB: market
  POSTGRES_USER: market
  POSTGRES_PASSWORD: market

cache:
  paths:
    - .cache/pip

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Stage: lint ---------------------------------------------------------

lint:backend:
  stage: lint
  image: python:3.12-slim
  script:
    - |
      if [ -f backend/pyproject.toml ] || [ -f backend/requirements.txt ]; then
        pip install ruff
        ruff check backend || true
      else
        echo "Backend not scaffolded yet — lint skipped (stage 0)"
      fi
  allow_failure: true
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: always
    - when: on_success

lint:docs:
  stage: lint
  image: alpine:3.20
  script:
    - echo "Checking required docs exist"
    - test -f README.md
    - test -f ROADMAP.md
    - test -f CONTRIBUTING.md
    - test -f docs/architecture.md
    - test -f docs/domain.md
    - test -f docs/api.md
    - test -f docs/setup.md

# --- Stage: test ---------------------------------------------------------

test:backend:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    DATABASE_URL: "postgresql+psycopg://market:market@postgres:5432/market"
  script:
    - |
      if [ -f backend/requirements.txt ]; then
        pip install -r backend/requirements.txt
        cd backend && pytest -q
      else
        echo "No backend tests yet — placeholder OK (stage 0)"
      fi
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always

# --- Stage: build --------------------------------------------------------

build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - |
      if [ -f backend/Dockerfile ]; then
        docker build -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" backend
        echo "Built $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
      else
        echo "No Dockerfile yet — build skipped (stage 0)"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*

# --- Stage: deploy -------------------------------------------------------

deploy:staging:
  stage: deploy
  image: alpine:3.20
  script:
    - echo "Staging deploy hook — configure SSH/compose on stage 1+"
    - echo "Image tag would be $CI_COMMIT_SHORT_SHA"
  when: manual
  environment:
    name: staging
    action: start
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
